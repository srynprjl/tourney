# Rate Limiting
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;

    # Universal Proxy Settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Common CORS Headers
    set $cors_origin "*";
    set $cors_methods "GET, POST, OPTIONS, PUT, DELETE, PATCH";
    set $cors_headers "Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since";

    location /api/auth {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        rewrite ^/api/auth(.*)$ $1 break;
        proxy_pass http://auth-service:8081;
    }

    location /api/tournaments {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        rewrite ^/api/tournaments(.*)$ $1 break;
        proxy_pass http://tournament-service:8082;
    }

    location /api/matches {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        rewrite ^/api/matches(.*)$ $1 break;
        proxy_pass http://match-service:8083;
    }

    location /api/team {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        rewrite ^/api/team(.*)$ $1 break;
        proxy_pass http://team-service:8084;
    }

    location /api/profile {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        rewrite ^/api/profile(.*)$ $1 break;
        proxy_pass http://profile-service:8086;
    }

    location /api/venue {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        rewrite ^/api/venue(.*)$ $1 break;
        proxy_pass http://venue-service:8088;
    }

    location /api/realtime/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
            return 204;
        }
        proxy_pass http://realtime-service:8087/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
    }
}
