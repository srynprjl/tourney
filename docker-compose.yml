version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tournament_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service
    ports:
      - "8081:8081"
    environment:
      - DB_URL=postgres://user:password@postgres:5432/tournament_db?sslmode=disable
      - JWT_SECRET=your_jwt_secret
    depends_on:
      - postgres

  tournament-service:
    build: ./services/tournament-service
    ports:
      - "8082:8082"
    environment:
      - DB_URL=postgres://user:password@postgres:5432/tournament_db?sslmode=disable
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      - postgres
      - auth-service

  match-service:
    build: ./services/match-service
    ports:
      - "8083:8083"
    environment:
      - DB_URL=postgres://user:password@postgres:5432/tournament_db?sslmode=disable
      - TOURNAMENT_SERVICE_URL=http://tournament-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      - postgres
      - tournament-service

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080 # This might need an API gateway later
    depends_on:
      - auth-service
      - tournament-service
      - match-service

volumes:
  postgres_data:
